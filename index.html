<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasirku Pro - Majoo POS Clone</title>
  
  <!-- Font & Icon Google -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary: #00b96b;
      --primary-hover: #009656;
      --bg-app: #f4f6f9;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --danger: #ef4444;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg-app); color: var(--text-main); height: 100vh; overflow: hidden; }

    .app-layout { display: flex; height: 100vh; }

    /* --- SIDEBAR MAJOO --- */
    .sidebar {
      width: 230px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      padding: 20px 15px; justify-content: space-between;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-logo {
      width: 42px; height: 42px; background: var(--primary); color: white;
      border-radius: 12px; display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem; font-weight: 800;
    }
    .brand-title { font-size: 1.15rem; font-weight: 800; }
    .brand-title span { color: var(--primary); }

    .nav-list { display: flex; flex-direction: column; gap: 6px; margin-top: 30px; }
    .nav-link {
      display: flex; align-items: center; gap: 12px; padding: 12px 16px;
      color: var(--text-sub); text-decoration: none; font-weight: 600; font-size: 0.9rem;
      border-radius: 10px; transition: all 0.2s;
    }
    .nav-link:hover, .nav-link.active { background: #e6f8f0; color: var(--primary); }

    .user-profile {
      display: flex; align-items: center; gap: 10px; padding: 12px;
      background: var(--bg-app); border-radius: 12px;
    }
    .avatar {
      width: 36px; height: 36px; background: #cbd5e1; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; color: white;
    }

    /* --- CATALOG & POS MAIN --- */
    .pos-main { flex: 1; display: flex; flex-direction: column; padding: 20px; overflow-y: auto; gap: 20px; }
    
    .search-bar {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 18px; display: flex; align-items: center; gap: 12px;
    }
    .search-bar input { border: none; outline: none; width: 100%; font-size: 0.95rem; }
    .search-bar i { color: var(--text-sub); }

    .cat-wrapper { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; }
    .cat-btn {
      border: 1px solid var(--border); background: var(--surface);
      padding: 8px 18px; border-radius: 20px; font-weight: 600; font-size: 0.85rem;
      color: var(--text-sub); cursor: pointer; white-space: nowrap; transition: 0.2s;
    }
    .cat-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

    .grid-products {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 16px;
    }
    .card-product {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      padding: 12px; cursor: pointer; transition: all 0.2s; display: flex; flex-direction: column;
    }
    .card-product:hover { transform: translateY(-4px); box-shadow: 0 10px 20px rgba(0,0,0,0.04); }
    .card-product img { width: 100%; height: 110px; object-fit: cover; border-radius: 10px; margin-bottom: 10px; }
    .product-name { font-weight: 700; font-size: 0.88rem; margin-bottom: 4px; line-height: 1.2; }
    .product-price { color: var(--primary); font-weight: 800; font-size: 0.95rem; margin-top: auto; }

    /* --- CART PANEL RIGHT --- */
    .cart-panel {
      width: 380px; background: var(--surface); border-left: 1px solid var(--border);
      display: flex; flex-direction: column;
    }
    .cart-header {
      padding: 20px; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .cart-header h3 { font-size: 1.05rem; font-weight: 800; }
    .btn-clear { background: none; border: none; color: var(--danger); font-size: 0.85rem; font-weight: 600; cursor: pointer; }

    .cart-list { flex: 1; padding: 20px; overflow-y: auto; }
    .empty-cart { text-align: center; color: var(--text-sub); margin-top: 100px; }
    .empty-cart i { font-size: 3.5rem; margin-bottom: 12px; opacity: 0.5; }

    .cart-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .item-info { display: flex; flex-direction: column; gap: 2px; }
    .item-title { font-weight: 700; font-size: 0.88rem; }
    .item-price { color: var(--primary); font-weight: 700; font-size: 0.82rem; }
    .qty-controls { display: flex; align-items: center; gap: 8px; }
    .btn-qty {
      width: 28px; height: 28px; border: 1px solid var(--border); background: white;
      border-radius: 8px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }

    .cart-summary { padding: 20px; border-top: 1px solid var(--border); background: #f8fafc; }
    .summary-item { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.88rem; color: var(--text-sub); }
    .summary-item.total { font-size: 1.15rem; font-weight: 800; color: var(--text-main); margin-top: 10px; }

    .payment-methods { display: flex; gap: 8px; margin: 15px 0; }
    .pay-opt {
      flex: 1; padding: 8px; border: 1px solid var(--border); border-radius: 8px;
      background: white; text-align: center; font-size: 0.8rem; font-weight: 700;
      cursor: pointer; color: var(--text-sub);
    }
    .pay-opt.active { border-color: var(--primary); background: #e6f8f0; color: var(--primary); }

    .btn-checkout {
      width: 100%; padding: 15px; background: var(--primary); color: white;
      border: none; border-radius: 12px; font-weight: 800; font-size: 1rem;
      cursor: pointer; transition: 0.2s;
    }
    .btn-checkout:hover { background: var(--primary-hover); }

    /* RESPONSIVE FOR MOBILE */
    @media (max-width: 900px) {
      .app-layout { flex-direction: column; height: auto; overflow: auto; }
      .sidebar { width: 100%; height: auto; }
      .cart-panel { width: 100%; border-left: none; border-top: 1px solid var(--border); }
    }
  </style>
</head>
<body>

  <div class="app-layout">
    <!-- SIDEBAR NAVIGASI -->
    <aside class="sidebar">
      <div>
        <div class="brand">
          <div class="brand-logo"><i class="fa-solid fa-cash-register"></i></div>
          <div class="brand-title">Kasirku<span>PRO</span></div>
        </div>
        <nav class="nav-list">
          <a href="#" class="nav-link active"><i class="fa-solid fa-store"></i> Kasir / POS</a>
          <a href="#" class="nav-link"><i class="fa-solid fa-box-archive"></i> Produk</a>
          <a href="#" class="nav-link"><i class="fa-solid fa-receipt"></i> Transaksi</a>
          <a href="#" class="nav-link"><i class="fa-solid fa-chart-pie"></i> Laporan</a>
        </nav>
      </div>
      <div class="user-profile">
        <div class="avatar"><i class="fa-solid fa-user-gear"></i></div>
        <div>
          <div style="font-weight:700; font-size:0.85rem;">Kasir Store</div>
          <div style="font-size:0.75rem; color:var(--text-sub);">Cabang Utama</div>
        </div>
      </div>
    </aside>

    <!-- KATALOG PRODUK -->
    <main class="pos-main">
      <div class="search-bar">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Cari produk atau menu kasir..." onkeyup="filterProducts()">
      </div>

      <div class="cat-wrapper">
        <button class="cat-btn active" onclick="setCategory('all', this)">Semua Menu</button>
        <button class="cat-btn" onclick="setCategory('makanan', this)">Makanan</button>
        <button class="cat-btn" onclick="setCategory('minuman', this)">Minuman</button>
        <button class="cat-btn" onclick="setCategory('snack', this)">Cemilan</button>
      </div>

      <div class="grid-products" id="productContainer"></div>
    </main>

    <!-- DETAIL KERANJANG -->
    <aside class="cart-panel">
      <div class="cart-header">
        <h3><i class="fa-solid fa-cart-shopping"></i> Pesanan Baru</h3>
        <button class="btn-clear" onclick="resetCart()"><i class="fa-solid fa-rotate-left"></i> Reset</button>
      </div>

      <div class="cart-list" id="cartContainer">
        <div class="empty-cart">
          <i class="fa-solid fa-basket-shopping"></i>
          <p>Belum ada menu dipilih</p>
        </div>
      </div>

      <div class="cart-summary">
        <div class="summary-item"><span>Subtotal</span><span id="txtSubtotal">Rp 0</span></div>
        <div class="summary-item"><span>Pajak Resto (10%)</span><span id="txtTax">Rp 0</span></div>
        <div class="summary-item total"><span>Total Bayar</span><span id="txtTotal">Rp 0</span></div>

        <div style="margin-top:12px; font-weight:700; font-size:0.8rem; color:var(--text-sub);">Metode Pembayaran:</div>
        <div class="payment-methods">
          <div class="pay-opt active" onclick="setPayment('Cash', this)"><i class="fa-solid fa-money-bill-wave"></i> Tunai</div>
          <div class="pay-opt" onclick="setPayment('QRIS', this)"><i class="fa-solid fa-qrcode"></i> QRIS</div>
          <div class="pay-opt" onclick="setPayment('Debit', this)"><i class="fa-solid fa-credit-card"></i> Debit</div>
        </div>

        <button class="btn-checkout" onclick="processPayment()"><i class="fa-solid fa-print"></i> Proses & Cetak Struk</button>
      </div>
    </aside>
  </div>

  <script>
    // DATA PRODUK DUMMY ALA MAJOO
    const products = [
      { id: 1, name: 'Kopi Susu Aren Pro', price: 18000, category: 'minuman', img: 'https://images.unsplash.com/photo-1541167760496-1628856ab772?w=300' },
      { id: 2, name: 'Ice Americano Blend', price: 15000, category: 'minuman', img: 'https://images.unsplash.com/photo-1517701604599-bb29b565090c?w=300' },
      { id: 3, name: 'Nasi Goreng Spesial', price: 25000, category: 'makanan', img: 'https://images.unsplash.com/photo-1603133872878-684f208fb84b?w=300' },
      { id: 4, name: 'Roti Bakar Keju', price: 16000, category: 'snack', img: 'https://images.unsplash.com/photo-1584776296944-ab6fb57b0bdd?w=300' },
      { id: 5, name: 'French Fries Crispy', price: 12000, category: 'snack', img: 'https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=300' },
      { id: 6, name: 'Matcha Green Tea', price: 22000, category: 'minuman', img: 'https://images.unsplash.com/photo-1536256263959-770b48d82b0a?w=300' }
    ];

    let cart = [];
    let currentCategory = 'all';
    let selectedPayment = 'Cash';

    // RENDER PRODUK S
    function renderProducts(items) {
      const container = document.getElementById('productContainer');
      container.innerHTML = '';

      items.forEach(p => {
        const card = document.createElement('div');
        card.className = 'card-product';
        card.onclick = () => addToCart(p.id);
        card.innerHTML = `
          <img src="${p.img}" alt="${p.name}">
          <div class="product-name">${p.name}</div>
          <div class="product-price">Rp ${p.price.toLocaleString('id-ID')}</div>
        `;
        container.appendChild(card);
      });
    }

    // KERANJANG LOGIC
    function addToCart(id) {
      const item = products.find(p => p.id === id);
      const inCart = cart.find(c => c.id === id);

      if (inCart) {
        inCart.qty += 1;
      } else {
        cart.push({ ...item, qty: 1 });
      }
      updateCartView();
    }

    function changeQty(id, delta) {
      const item = cart.find(c => c.id === id);
      if(!item) return;

      item.qty += delta;
      if (item.qty <= 0) {
        cart = cart.filter(c => c.id !== id);
      }
      updateCartView();
    }

    function resetCart() {
      cart = [];
      updateCartView();
    }

    function updateCartView() {
      const container = document.getElementById('cartContainer');
      
      if (cart.length === 0) {
        container.innerHTML = `
          <div class="empty-cart">
            <i class="fa-solid fa-basket-shopping"></i>
            <p>Belum ada menu dipilih</p>
          </div>`;
        document.getElementById('txtSubtotal').innerText = 'Rp 0';
        document.getElementById('txtTax').innerText = 'Rp 0';
        document.getElementById('txtTotal').innerText = 'Rp 0';
        return;
      }

      container.innerHTML = '';
      let subtotal = 0;

      cart.forEach(item => {
        const itemTotal = item.price * item.qty;
        subtotal += itemTotal;

        const el = document.createElement('div');
        el.className = 'cart-item';
        el.innerHTML = `
          <div class="item-info">
            <div class="item-title">${item.name}</div>
            <div class="item-price">Rp ${item.price.toLocaleString('id-ID')}</div>
          </div>
          <div class="qty-controls">
            <button class="btn-qty" onclick="changeQty(${item.id}, -1)">-</button>
            <span style="font-weight:700; font-size:0.85rem;">${item.qty}</span>
            <button class="btn-qty" onclick="changeQty(${item.id}, 1)">+</button>
          </div>
        `;
        container.appendChild(el);
      });

      const tax = subtotal * 0.1;
      const total = subtotal + tax;

      document.getElementById('txtSubtotal').innerText = `Rp ${subtotal.toLocaleString('id-ID')}`;
      document.getElementById('txtTax').innerText = `Rp ${tax.toLocaleString('id-ID')}`;
      document.getElementById('txtTotal').innerText = `Rp ${total.toLocaleString('id-ID')}`;
    }

    // FILTER & SEARCH
    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const filtered = cat === 'all' ? products : products.filter(p => p.category === cat);
      renderProducts(filtered);
    }

    function filterProducts() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = products.filter(p => p.name.toLowerCase().includes(query));
      renderProducts(filtered);
    }

    function setPayment(method, el) {
      selectedPayment = method;
      document.querySelectorAll('.pay-opt').forEach(opt => opt.classList.remove('active'));
      el.classList.add('active');
    }

    function processPayment() {
      if (cart.length === 0) {
        alert('Pilih produk terlebih dahulu!');
        return;
      }
      alert(`Transaksi Sukses!\nMetode Pembayaran: ${selectedPayment}\nTerima kasih telah menggunakan Kasirku Pro.`);
      resetCart();
    }

    // INIT
    renderProducts(products);
  </script>
</body>
</html>
